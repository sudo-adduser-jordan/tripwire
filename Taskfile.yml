version: '3'
silent: true
output: group
set: [errexit, nounset, pipefail]
dotenv: [.env]
vars:
  BLUE: '\033[1;34m'
  GREEN: '\033[1;32m'
  YELLOW: '\033[1;33m'
  RED: '\033[1;31m'
  CYAN: '\033[1;36m'
  RESET: '\033[0m'
tasks:
  install:
    desc: Install Elixir, Node, and asset dependencies
    cmds:
      - echo -e "{{.BLUE}}[install]{{.RESET}} {{.CYAN}}mix deps.get{{.RESET}}"
      - mix deps.get
      - echo -e "{{.BLUE}}[install]{{.RESET}} {{.CYAN}}mix assets.setup{{.RESET}}"
      - mix assets.setup
      - echo -e "{{.BLUE}}[install]{{.RESET}} {{.CYAN}}npm ci in assets{{.RESET}}"
      - npm ci --prefix assets
      - echo -e "{{.GREEN}}[install]{{.RESET}} dependencies installed"
  update:
    desc: Update Elixir and Node dependencies
    cmds:
      - echo -e "{{.BLUE}}[update]{{.RESET}} {{.CYAN}}mix deps.update --all{{.RESET}}"
      - mix deps.update --all
      - echo -e "{{.BLUE}}[update]{{.RESET}} {{.CYAN}}npm update in assets{{.RESET}}"
      - npm update --prefix assets
      - echo -e "{{.GREEN}}[update]{{.RESET}} dependencies updated"
  remove:
    desc: Remove build artifacts and installed dependencies
    cmds:
      - echo -e "{{.YELLOW}}[remove]{{.RESET}} {{.CYAN}}rm -rf _build deps assets/node_modules priv/static/assets cover tmp{{.RESET}}"
      - rm -rf _build deps assets/node_modules priv/static/assets cover tmp
      - echo -e "{{.GREEN}}[remove]{{.RESET}} artifacts removed"
  setup:
    desc: First-time setup of database, assets, SDE, and log directories
    cmds:
      - echo -e "{{.BLUE}}[setup]{{.RESET}} {{.CYAN}}mkdir -p priv/sde logs/test logs/errors{{.RESET}}"
      - mkdir -p priv/sde logs/test logs/errors
      - echo -e "{{.BLUE}}[setup]{{.RESET}} {{.CYAN}}curl eve-online-static-data-latest-jsonl.zip{{.RESET}}"
      - curl -L --etag-save priv/sde/sde.etag --etag-compare priv/sde/sde.etag -o priv/sde/eve-online-static-data-latest-jsonl.zip https://developers.eveonline.com/static-data/eve-online-static-data-latest-jsonl.zip
      - echo -e "{{.BLUE}}[setup]{{.RESET}} {{.CYAN}}mix deps.get{{.RESET}}"
      - mix deps.get
      - echo -e "{{.BLUE}}[setup]{{.RESET}} {{.CYAN}}mix ecto.setup{{.RESET}}"
      - mix ecto.setup
      - echo -e "{{.BLUE}}[setup]{{.RESET}} {{.CYAN}}mix assets.setup{{.RESET}}"
      - mix assets.setup
      - echo -e "{{.BLUE}}[setup]{{.RESET}} {{.CYAN}}mix assets.build{{.RESET}}"
      - mix assets.build
      - echo -e "{{.GREEN}}[setup]{{.RESET}} setup complete"
  migrate:
    desc: Run database migrations for dev, test, and prod
    cmds:
      - echo -e "{{.BLUE}}[migrate]{{.RESET}} {{.CYAN}}mix ecto.migrate{{.RESET}}"
      - mix ecto.migrate
      - echo -e "{{.BLUE}}[migrate]{{.RESET}} {{.CYAN}}MIX_ENV=test mix ecto.migrate{{.RESET}}"
      - MIX_ENV=test mix ecto.migrate
      - echo -e "{{.BLUE}}[migrate]{{.RESET}} {{.CYAN}}MIX_ENV=prod mix ecto.migrate{{.RESET}}"
      - MIX_ENV=prod DATABASE_PATH="${DATABASE_PATH:-./priv/db/tripwire-prod.db}" mix ecto.migrate
      - echo -e "{{.GREEN}}[migrate]{{.RESET}} migrations complete"
  start:
    desc: Restart the production server in the background
    cmds:
      - task: stop
      - mkdir -p logs tmp
      - echo -e "{{.BLUE}}[start]{{.RESET}} {{.CYAN}}reset demo data{{.RESET}}"
      - MIX_ENV=prod DATABASE_PATH="${DATABASE_PATH:-./priv/db/tripwire-prod.db}" mix tripwire.reset_demo
      - echo -e "{{.BLUE}}[start]{{.RESET}} {{.CYAN}}MIX_ENV=prod mix tailwind tripwire --minify{{.RESET}}"
      - MIX_ENV=prod mix tailwind tripwire --minify
      - echo -e "{{.BLUE}}[start]{{.RESET}} {{.CYAN}}MIX_ENV=prod mix esbuild tripwire --minify{{.RESET}}"
      - MIX_ENV=prod mix esbuild tripwire --minify
      - echo -e "{{.BLUE}}[start]{{.RESET}} {{.CYAN}}MIX_ENV=prod mix phx.digest{{.RESET}}"
      - MIX_ENV=prod mix phx.digest
      - echo -e "{{.BLUE}}[start]{{.RESET}} {{.CYAN}}mix phx.server{{.RESET}}"
      - |
        sh -c 'MIX_ENV=prod DATABASE_PATH="${DATABASE_PATH:-./priv/db/tripwire-prod.db}" \
          setsid nohup mix phx.server > logs/prod.log 2>&1 & echo $! > tmp/tripwire-prod.pid'
      - echo -e "{{.BLUE}}[start]{{.RESET}} {{.CYAN}}waiting for port ${PORT:-4000}{{.RESET}}"
      - |
        sh -c 'pid="$(cat tmp/tripwire-prod.pid)"
        for _ in $(seq 1 1800); do
          if grep -q "\[info\] Running TripwireWeb.Endpoint with" logs/prod.log 2>/dev/null; then
            exit 0
          fi
          if ! kill -0 "$pid" 2>/dev/null; then
            echo -e "{{.RED}}[start]{{.RESET}} server exited during boot"
            tail -20 logs/prod.log
            exit 1
          fi
          sleep 0.2
        done
        echo -e "{{.RED}}[start]{{.RESET}} server did not report a running endpoint"
        tail -20 logs/prod.log
        exit 1'
      - echo -e "{{.GREEN}}[start]{{.RESET}} http://localhost:${PORT:-4000}"
  stop:
    desc: Stop running Tripwire server processes
    cmds:
      - echo -e "{{.YELLOW}}[stop]{{.RESET}} {{.CYAN}}stopping tripwire{{.RESET}}"
      - |
        sh -c 'if [ -f tmp/tripwire-prod.pid ]; then
          pid="$(cat tmp/tripwire-prod.pid)"
          kill -TERM -- "-$pid" 2>/dev/null || kill -TERM "$pid" 2>/dev/null || true
          rm -f tmp/tripwire-prod.pid
          for _ in $(seq 1 100); do
            kill -0 "$pid" 2>/dev/null || break
            sleep 0.1
          done
        fi
        pkill -f "mi[x] phx\.server" 2>/dev/null || true
        for _ in $(seq 1 25); do
          curl -s -o /dev/null "http://localhost:${PORT:-4000}/" || break
          sleep 0.2
        done'
      - echo -e "{{.GREEN}}[stop]{{.RESET}} stopped"
  dev:
    desc: Attach to the production server output
    cmds:
      - touch logs/prod.log
      - tail -f logs/prod.log
